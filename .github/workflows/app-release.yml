name: app-release

# Publishes a GitHub release with the signed APK when a push to main bumps
# app/version.json. Pushes that leave the version unchanged do nothing.
# Re-run by hand (workflow_dispatch) if a run fails: a release only counts once
# its app-v<version> tag exists, so the next run tries again.
#
# The APK is always attached as life-app.apk, because the app's "Update
# required" screen links to releases/latest/download/life-app.apk. It is
# attached with latest.json ({version, versionCode}), which the app fetches from
# releases/latest/download/latest.json to find out whether a newer one exists.

on:
  push:
    branches: [main]
    paths:
      - 'app/version.json'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled halfway.
concurrency:
  group: app-release

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: .github/scripts/check-app-version.sh

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Fail a hung build instead of letting it run to the 6-hour default.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APK: app/android/app/build/outputs/apk/release/app-release.apk
      # On the job, not on prebuild alone: the Gradle build evaluates
      # app.config.ts again, for the JS bundle and the config embedded in the
      # APK, and without APP_VARIANT it gets the development variant's.
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle's downloads (the Gradle distribution, Maven
      # dependencies) between runs. The native compile output lives in the
      # project, which prebuild --clean regenerates, so it isn't cached.
      - uses: gradle/actions/setup-gradle@v6
      - name: Install dependencies
        working-directory: app
        run: npm ci
      # A secret can only hold text, but a keystore is a binary file, so it's
      # stored base64-encoded and decoded back to the file here.
      - name: Decode the keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/life-app-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Generate the native project
        working-directory: app
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1
      # Both phones are 64-bit ARM. Leaving out armeabi-v7a, x86 and x86_64
      # cuts the native compile, the longest part of the build, to a quarter.
      - name: Build the release APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        env:
          ORG_GRADLE_PROJECT_lifeAppUploadStoreFile: ${{ runner.temp }}/life-app-release.jks
          ORG_GRADLE_PROJECT_lifeAppUploadStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_lifeAppUploadKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Without the keystore properties Gradle falls back to the debug key, which
      # still produces a valid APK. This is what stops one from being published.
      - name: Check the APK is signed with the release key
        shell: bash
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "$APK")
          echo "$certs"
          # The signer label varies ("Signer #1", "Signer (minSdkVersion=…)",
          # "V2 Signer"), so match any. V2 and V3 lines repeat the same digest,
          # which sort -u collapses. More than one distinct digest fails the
          # comparison.
          actual=$(echo "$certs" | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' | sort -u)
          # keytool prints AA:BB:…, apksigner prints aabb…
          expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "::error::The APK's signing certificate is '${actual:-none}', expected '${expected:-unset}' (ANDROID_RELEASE_CERT_SHA256)."
            exit 1
          fi
          echo "Signed with the release key ($actual)"
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      # The native side and the embedded config come from separate evaluations
      # of app.config.ts, so a production package can still carry the
      # development config (and its API URL). The package is a stand-in for
      # the whole variant, since every value comes from the same evaluation.
      - name: Check the APK embeds the production config
        run: |
          package=$(unzip -p "$APK" assets/app.config | jq -r '.android.package')
          if [[ "$package" != "com.lakaniemi.lifeapp" ]]; then
            echo "::error::The APK embeds the config for '$package', expected com.lakaniemi.lifeapp."
            exit 1
          fi
      # Both files go in one command: gh uploads them to a draft and publishes it
      # (creating the tag) only when all are there, so latest.json never appears
      # without the APK, or before the signing check above has passed.
      - name: Publish the release
        run: |
          version=$(jq -r '.version' app/version.json)
          cp "$APK" life-app.apk
          jq '{version, versionCode}' app/version.json > latest.json
          gh release create "app-v$version" life-app.apk latest.json \
            --target "$GITHUB_SHA" \
            --title "Life App $version" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
