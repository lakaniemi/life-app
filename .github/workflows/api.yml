name: api

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For finding main's coverage artifact to compare against.
      actions: read
      # For the coverage comment.
      pull-requests: write
    services:
      # Same major version as api/compose.yaml.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lifeapp
          POSTGRES_PASSWORD: lifeapp
          POSTGRES_DB: lifeapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeapp -d lifeapp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: api
      - name: Check sqlc-generated code is up to date
        run: go tool sqlc diff
      - run: go build ./...
      # Same coverage flags as `make cover`.
      - run: go test -race -coverprofile=coverage.out -coverpkg=./internal/... ./...
        env:
          TEST_DATABASE_URL: postgres://lifeapp:lifeapp@localhost:5432/lifeapp?sslmode=disable
      # Runs on main too: the report on PRs compares against this artifact
      # from the PR's base commit.
      - uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: api/coverage.out
      # Comments on the PR with only the packages it impacts, and the change
      # versus main.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: fgrosse/go-coverage-report@v1.5.0
        with:
          coverage-file-name: coverage.out
          trim: github.com/lakaniemi/life-app/api

  # Publishes the image that production runs. The server polls :production
  # and deploys it, so this job needs no access to the server.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Runs one at a time, so an older run can't move :production after a
    # newer one.
    concurrency:
      group: api-publish
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/lakaniemi/life-app-api:${{ github.sha }}
            ghcr.io/lakaniemi/life-app-api:production
          # Links the package to this repo, so it inherits the repo's access.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
