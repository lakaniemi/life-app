name: api

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same major version as api/compose.yaml.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lifeapp
          POSTGRES_PASSWORD: lifeapp
          POSTGRES_DB: lifeapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeapp -d lifeapp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: api
      - name: Check sqlc-generated code is up to date
        run: go tool sqlc diff
      - run: go build ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://lifeapp:lifeapp@localhost:5432/lifeapp?sslmode=disable
