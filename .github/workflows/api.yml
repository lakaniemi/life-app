name: api

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the coverage comment.
      pull-requests: write
    services:
      # Same major version as api/compose.yaml.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lifeapp
          POSTGRES_PASSWORD: lifeapp
          POSTGRES_DB: lifeapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeapp -d lifeapp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: api
      - name: Check sqlc-generated code is up to date
        run: go tool sqlc diff
      - run: go build ./...
      # Same coverage flags as `make cover`.
      - run: go test -race -coverprofile=coverage.out -coverpkg=./internal/... ./...
        env:
          TEST_DATABASE_URL: postgres://lifeapp:lifeapp@localhost:5432/lifeapp?sslmode=disable
      # Edits the bot's previous comment, so each PR keeps a single coverage
      # comment that updates on every push.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          {
            echo "### API coverage: $total"
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo "| File | Function | Coverage |"
            echo "| --- | --- | ---: |"
            # Rows look like "<module>/internal/x/y.go:12:  Func  85.7%".
            go tool cover -func=coverage.out | awk -v prefix="$(go list -m)/" '
              /^total:/ { next }
              { sub(prefix, "", $1); sub(/:$/, "", $1); printf "| `%s` | `%s` | %s |\n", $1, $2, $3 }'
            echo "</details>"
            echo
            echo "To inspect coverage line-by-line, run \`make cover-html\` in \`api/\` locally."
          } > coverage.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file coverage.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
