name: api

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the coverage comment.
      pull-requests: write
    services:
      # Same major version as api/compose.yaml.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lifeapp
          POSTGRES_PASSWORD: lifeapp
          POSTGRES_DB: lifeapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeapp -d lifeapp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: api
      - name: Check sqlc-generated code is up to date
        run: go tool sqlc diff
      - run: go build ./...
      # Same coverage flags as `make cover`.
      - run: go test -race -coverprofile=coverage.out -coverpkg=./internal/... ./...
        env:
          TEST_DATABASE_URL: postgres://lifeapp:lifeapp@localhost:5432/lifeapp?sslmode=disable
      - name: Coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          {
            echo "### API coverage: $total"
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
            echo
            echo "HTML report: \`api-coverage\` artifact on the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      # Edits the bot's previous comment, so each PR keeps a single coverage
      # comment that updates on every push.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        run: gh pr comment "$PR_NUMBER" --body-file coverage.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          # `uses` steps ignore defaults.run.working-directory.
          path: |
            api/coverage.out
            api/coverage.html
