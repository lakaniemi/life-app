name: app

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
      - '.github/scripts/check-app-version.sh'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
      - '.github/scripts/check-app-version.sh'

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check compares app/version.json with the release tags.
          fetch-depth: 0
      # A bad version bump fails here, on the pull request, not after the merge
      # when the release workflow would trip over it.
      - run: ../.github/scripts/check-app-version.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Fails when a package is out of line with the installed Expo SDK's
      # versions. Offline, it checks against expo/bundledNativeModules.json
      # from the lockfile; online, it would compare with Expo's newest patch
      # releases, so any PR could fail the day Expo ships one.
      - run: npx expo install --check
        env:
          CI: 1
          EXPO_OFFLINE: 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
