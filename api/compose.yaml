services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lifeapp
      POSTGRES_PASSWORD: lifeapp
      POSTGRES_DB: lifeapp
    ports:
      - "5432:5432"
    volumes:
      # PG18 images keep data in a version-specific subdirectory of this path,
      # so mount the parent rather than /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeapp -d lifeapp"]
      interval: 2s
      timeout: 5s
      retries: 15

  # No ENVIRONMENT, so both run with prod defaults.
  migrate:
    build: .
    image: life-app-api
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://lifeapp:lifeapp@postgres:5432/lifeapp?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: life-app-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://lifeapp:lifeapp@postgres:5432/lifeapp?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
