# Hot reload config for `make dev`. Only settings that differ from air's
# defaults are listed; see https://github.com/air-verse/air.

# Build output goes to bin/, which is already gitignored.
tmp_dir = "bin"

[build]
cmd = "go build -o ./bin/api-dev ./cmd/api"
entrypoint = ["./bin/api-dev"]
include_ext = ["go"]
# Send SIGINT and wait for our graceful shutdown instead of killing outright.
send_interrupt = true
kill_delay = "5s"
